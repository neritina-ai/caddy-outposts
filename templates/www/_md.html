<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .OriginalReq.URL.Path }}</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--code:#f6f8fa;--link:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--code:#151b23;--link:#4493f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Segoe UI","Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;font-size:.85rem}
header .p{color:var(--mut);word-break:break-all;flex:1 1 12rem}
header a{color:var(--link);text-decoration:none;white-space:nowrap}
main{max-width:52rem;margin:0 auto;padding:1rem 1rem 5rem}
h1,h2,h3,h4{line-height:1.3;margin:1.6em 0 .6em}
h1,h2{padding-bottom:.3em;border-bottom:1px solid var(--line)}
h1:first-child{margin-top:.3em}
a{color:var(--link)}
code{background:var(--code);padding:.15em .4em;border-radius:6px;font-size:.9em;font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
pre{background:var(--code);padding:.9rem;border-radius:8px;overflow-x:auto}
pre code{background:none;padding:0}
blockquote{margin:0;padding:0 1em;color:var(--mut);border-left:.25em solid var(--line)}
table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
th,td{border:1px solid var(--line);padding:.4rem .8rem}
tr:nth-child(2n){background:var(--code)}
img{max-width:100%}
hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
</style>
<header>
  <span class="p">{{ .OriginalReq.URL.Path }}</span>
  <a href="?raw=1">raw</a>
  <a href="./">📁</a>
  <a href="/">🏠</a>
</header>
<main>
{{- $p := .OriginalReq.URL.Path -}}
{{- markdown (httpInclude (print $p "?raw=1")) -}}
</main>
</html>
