<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__MACHINE__</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--card:#f6f8fa;--link:#0969da}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--card:#151b23;--link:#4493f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Noto Sans TC",system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:3rem 1rem 4rem}
h1{font-size:1.4rem;margin:0 0 .4em}
p{color:var(--mut);font-size:.92rem}
a{color:var(--link)}
a.go{display:inline-block;margin:1.4rem 0;background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:.8rem 1.2rem;text-decoration:none;color:inherit;font-weight:600}
code{background:var(--card);border:1px solid var(--line);padding:.1em .4em;border-radius:6px;font-size:.85em}
footer{margin-top:2rem;font-size:.8rem;color:var(--mut);line-height:1.8}
</style>
<main>
  <h1>__MACHINE__</h1>
  <p>這一頁是內容根目錄裡的 <code>index.html</code>，<strong>它是你的</strong> —— 改掉或刪掉都可以。</p>

  <a class="go" href="/panel">→ 控制面板 /panel</a>

  <footer>
    控制面板不住在這裡，所以你怎麼動這個目錄都不會弄丟它。<br>
    刪掉這個檔案，這個網址就變成目錄列表。<br>
    這台有哪些網址，看 <a href="/panel">/panel</a>。
  </footer>
</main>
</html>
