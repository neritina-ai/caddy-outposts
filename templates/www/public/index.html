<h1>/pub</h1>
<p>這裡是<strong>對外公開、不需要密碼</strong>的唯讀路徑，給 Telegram 的 webview 用。</p>
<p>放進 <code>D:\www\public\</code> 的東西才會出現在這裡。例如
<code>D:\www\public\mydemo\index.html</code> → <code>/pub/mydemo/</code>。</p>
<p>不要把需要保護的東西放進來。</p>
